<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Coffee Rating App - Discover and vote for your favourite coffee. Modern, responsive frontend application.">
  <title>Coffee Rating App</title>
  
  <!-- Google Fonts: Playfair Display for classic coffee headings & Inter for clean text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Decorative background shapes -->
  <div class="bg-pattern" aria-hidden="true"></div>

  <!-- Main Application Wrapper -->
  <div class="app-container">
    
    <!-- Header Section -->
    <header class="app-header">
      <div class="header-badge">
        <span class="badge-icon">☕</span>
        <span class="badge-text">Artisan Coffee Collection</span>
      </div>
      <h1 class="app-title">Coffee Rating App</h1>
      <p class="app-subtitle">Discover and vote for your favourite coffee.</p>
      
      <!-- Interactive Header Controls -->
      <div class="header-controls">
        <button type="button" id="refresh-btn" class="btn-refresh" title="Refresh coffee list from database" aria-label="Refresh coffee collection">
          <span class="btn-refresh-icon" aria-hidden="true">🔄</span>
          <span class="btn-refresh-text">Refresh Collection</span>
        </button>
      </div>
    </header>

    <!-- Main Content: Coffee Cards Grid -->
    <main class="content-section">
      <div id="coffee-grid" class="coffee-grid" role="region" aria-label="Coffee options list" data-testid="coffee-container">
        <!-- Coffee cards are dynamically rendered by script.js -->
        <noscript>
          <p class="noscript-message">Please enable JavaScript to view and vote for the coffee selections.</p>
        </noscript>
      </div>
    </main>



  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Application Logic -->
  <script src="script.js"></script>
</body>
</html>
